# Tên project cố định: container và volume luôn có tiền tố "kio-store",
# không phụ thuộc tên thư mục chứa repo.
name: kio-store

# Mọi image đều ghi rõ phiên bản: máy dev, máy khác và CI chạy đúng cùng một bộ phần mềm.
# Tag trôi nổi (latest, php8.3-apache…) có thể tự đổi khi có bản mới và làm CI đỏ bất ngờ.
# Nâng cấp = sửa số phiên bản ở đây, chạy CI, xanh thì merge.

# Biến môi trường dùng chung cho "wordpress" và "wpcli": hai container chạy cùng
# một bộ code WordPress nên phải thấy cùng một cấu hình.
# (Khối bắt đầu bằng "x-" được Compose bỏ qua, chỉ dùng làm anchor &wp_env.)
x-wp-env: &wp_env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME}
  WORDPRESS_DB_USER: ${DB_USER}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
  WORDPRESS_TABLE_PREFIX: wp_
  # Server đặt KIO_WP_DEBUG=0, KIO_WP_ENV=production trong .env. Máy dev không cần đặt gì.
  WORDPRESS_DEBUG: ${KIO_WP_DEBUG:-1}
  # Đoạn PHP được chèn vào wp-config.php lúc chạy
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_DEBUG_LOG', true);
    define('WP_DEBUG_DISPLAY', false);
    define('WP_ENVIRONMENT_TYPE', '${KIO_WP_ENV:-local}');
    if ('production' === WP_ENVIRONMENT_TYPE) {
      define('FORCE_SSL_ADMIN', true);
      // Không cài, sửa plugin từ wp-admin. WP-CLI vẫn được: script cài đặt cần.
      define('DISALLOW_FILE_MODS', ! defined('WP_CLI'));
    }
    // Mất tài khoản admin cũng không sửa được PHP trong wp-admin.
    define('DISALLOW_FILE_EDIT', true);
    // Không tự cập nhật core/plugin/bản dịch: mọi phiên bản đã cố định trong repo, nâng cấp bằng
    // cách đổi số phiên bản rồi chạy CI. (WP-Cron chạy được thì WordPress sẽ tự cập nhật nếu để mặc định.)
    define('AUTOMATIC_UPDATER_DISABLED', true);
    // Việc nền do service "cron" chạy mỗi phút, không chạy kèm request của khách.
    define('DISABLE_WP_CRON', true);
    // Page cache (Cache Enabler) nạp advanced-cache.php trước khi WordPress khởi động.
    define('WP_CACHE', true);
    // Object cache (Redis). Redis tắt thì site vẫn chạy, chỉ chậm đi.
    define('WP_REDIS_HOST', 'redis');
    define('WP_REDIS_PREFIX', 'kio');
    define('WP_REDIS_GRACEFUL', true);
    define('WP_REDIS_CLIENT', 'predis'); // phpredis không nhanh hơn rõ rệt, không đáng tự build image
    // Plugin kio-store đọc 2 hằng số này để gửi mọi email vào Mailpit
    define('KIO_SMTP_HOST', 'mailpit');
    define('KIO_SMTP_PORT', 1025);

services:
  # ---------------------------------------------------------------
  # Database: nơi WordPress lưu toàn bộ nội dung và cài đặt
  # ---------------------------------------------------------------
  db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Chỉ coi là "sẵn sàng" khi đăng nhập được bằng user của WordPress
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------
  # WordPress: Apache + PHP + core WordPress
  # ---------------------------------------------------------------
  wordpress:
    image: wordpress:7.1.4-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # 127.0.0.1: chỉ máy này vào được, máy khác cùng Wi-Fi thì không.
      - "127.0.0.1:8080:80"
    environment: *wp_env
    volumes:
      # Toàn bộ file WordPress nằm trong volume Docker (không lẫn vào repo)
      - wp_data:/var/www/html
      # Chỉ 2 thư mục tự viết được mount từ repo ra
      - ./wp-content/themes/kio-child:/var/www/html/wp-content/themes/kio-child
      - ./wp-content/plugins/kio-store:/var/www/html/wp-content/plugins/kio-store
      # Apache nghe thêm cổng 8080 để WordPress tự gọi lại chính nó được (WP-Cron, Action Scheduler)
      - ./docker/apache/kio-loopback.conf:/etc/apache2/conf-enabled/kio-loopback.conf:ro
      # Cache trình duyệt cho CSS/JS/ảnh/font
      - ./docker/apache/kio-performance.conf:/etc/apache2/conf-enabled/kio-performance.conf:ro
      # Chặn file nhạy cảm, PHP trong uploads, thêm header bảo mật. Tên zz-: xem đầu file.
      - ./docker/apache/kio-security.conf:/etc/apache2/conf-enabled/zz-kio-security.conf:ro
      # Không tin X-Forwarded-For do khách tự gửi
      - ./docker/apache/remoteip.conf:/etc/apache2/conf-available/remoteip.conf:ro

  # ---------------------------------------------------------------
  # Redis: object cache. Giữ kết quả query và option trong RAM giữa các request, giúp những trang
  # page cache không giúp được (giỏ hàng, thanh toán, admin). Dữ liệu chỉ là cache nên không lưu xuống đĩa.
  # ---------------------------------------------------------------
  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------
  # Mailpit: hộp thư giả. Bắt mọi email WordPress gửi đi (SMTP cổng 1025
  # trong mạng Docker) và hiển thị trên web http://localhost:8025.
  # Không email nào thật sự ra ngoài internet.
  # ---------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # ---------------------------------------------------------------
  # phpMyAdmin: xem database bằng giao diện web
  # ---------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M

  # ---------------------------------------------------------------
  # WP-CLI: chạy lệnh "wp". Không tự khởi động khi "up",
  # chỉ chạy khi gọi: docker compose run --rm wpcli <lệnh>
  # ---------------------------------------------------------------
  wpcli:
    image: wordpress:cli-2.12.0-php8.3
    profiles: ["tools"]
    user: "33:33" # www-data, trùng chủ sở hữu file với container wordpress
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp_env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/kio-child:/var/www/html/wp-content/themes/kio-child
      - ./wp-content/plugins/kio-store:/var/www/html/wp-content/plugins/kio-store
      # Script PHP và dữ liệu mẫu, chỉ đọc. Chạy bằng: wp eval-file /scripts/<file>.php
      - ./scripts:/scripts:ro
      - ./data:/data:ro
    entrypoint: ["wp"]

  # ---------------------------------------------------------------
  # Cron hệ thống: chạy việc nền của WordPress mỗi phút (giá sale hẹn giờ, Action Scheduler…),
  # giống crontab trên server thật. WP-Cron mặc định chỉ chạy khi có khách vào trang.
  # ---------------------------------------------------------------
  cron:
    image: wordpress:cli-2.12.0-php8.3
    user: "33:33"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *wp_env
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/themes/kio-child:/var/www/html/wp-content/themes/kio-child
      - ./wp-content/plugins/kio-store:/var/www/html/wp-content/plugins/kio-store
    # "|| true": lúc đang cài, WordPress chưa sẵn sàng thì bỏ qua lượt đó.
    entrypoint: ["sh", "-c", "while true; do wp cron event run --due-now --quiet 2>/dev/null || true; sleep 60; done"]

  # ---------------------------------------------------------------
  # Sao lưu tự động vào ./backups. Cùng image với db: mysqldump đúng phiên bản.
  # Không hẹn giờ cố định: máy dev hay ngủ sẽ lỡ lượt. Mỗi giờ kiểm tra, bản gần nhất quá 24 giờ thì chạy.
  # Sao lưu hỏng thì container "unhealthy" (xem bằng docker compose ps).
  # ---------------------------------------------------------------
  backup:
    image: mysql:8.4.13
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      MYSQL_PWD: ${DB_PASSWORD}
      BACKUP_KEEP: 7
      BACKUP_EVERY_HOURS: 24
    volumes:
      - wp_data:/wp:ro
      - ./backups:/backups
      # Mount cả thư mục: mount từng file thì editor lưu file mới, container vẫn thấy file cũ.
      - ./scripts:/scripts:ro
    entrypoint: ["bash", "-c", "while true; do sleep 3600; bash /scripts/backup.sh --if-due || true; done"]
    healthcheck:
      test: ["CMD", "bash", "/scripts/backup.sh", "--health"]
      interval: 15s
      timeout: 5s
      retries: 1

volumes:
  db_data:
  wp_data:
