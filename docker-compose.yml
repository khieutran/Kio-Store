# Tên project cố định: container và volume luôn có tiền tố "kio-store",
# không phụ thuộc tên thư mục chứa repo.
name: kio-store

services:
  # ---------------------------------------------------------------
  # Database: nơi WordPress lưu toàn bộ nội dung và cài đặt
  # ---------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Chỉ coi là "sẵn sàng" khi đăng nhập được bằng user của WordPress
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------
  # WordPress: Apache + PHP + core WordPress
  # ---------------------------------------------------------------
  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes: &wp_volumes
      # Toàn bộ file WordPress nằm trong volume Docker (không lẫn vào repo)
      - wp_data:/var/www/html
      # Chỉ 2 thư mục tự viết được mount từ repo ra
      - ./wp-content/themes/kio-child:/var/www/html/wp-content/themes/kio-child
      - ./wp-content/plugins/kio-store:/var/www/html/wp-content/plugins/kio-store

  # ---------------------------------------------------------------
  # phpMyAdmin: xem database bằng giao diện web
  # ---------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 64M

  # ---------------------------------------------------------------
  # WP-CLI: chạy lệnh "wp". Không tự khởi động khi "up",
  # chỉ chạy khi gọi: docker compose run --rm wpcli <lệnh>
  # ---------------------------------------------------------------
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33" # www-data, trùng chủ sở hữu file với container wordpress
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp_volumes
    entrypoint: ["wp"]

volumes:
  db_data:
  wp_data:
