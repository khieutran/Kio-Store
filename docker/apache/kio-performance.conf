# Cache trình duyệt cho file tĩnh: khách quay lại không phải hỏi server lần nữa.
#
# CSS/JS 1 năm vẫn an toàn khi sửa code: URL có ?ver= đổi theo thời gian sửa file (child theme và
# kio-store dùng filemtime, core và plugin dùng số phiên bản), sửa file là ra URL mới, trình duyệt
# coi như file khác. Font đổi thì đổi tên file.
#
# Ảnh không có ?ver=, có thể bị thay mà giữ nguyên tên (tạo lại thumbnail) nên chỉ giữ 30 ngày.
#
# Không đặt cho text/html: WordPress tự quyết, trang có giá và giỏ hàng không được giữ ở trình duyệt.
# Mô hình 3D: Apache chưa biết đuôi .glb. Nén vì lưới hình học giảm được khoảng 4/5.
AddType model/gltf-binary .glb
<IfModule mod_deflate.c>
	AddOutputFilterByType DEFLATE model/gltf-binary
</IfModule>

<IfModule mod_expires.c>
	ExpiresActive On
	ExpiresByType text/css "access plus 1 year"
	ExpiresByType text/javascript "access plus 1 year"
	ExpiresByType application/javascript "access plus 1 year"
	ExpiresByType model/gltf-binary "access plus 1 year"
	ExpiresByType font/ttf "access plus 1 year"
	ExpiresByType font/woff "access plus 1 year"
	ExpiresByType font/woff2 "access plus 1 year"
	ExpiresByType image/png "access plus 30 days"
	ExpiresByType image/jpeg "access plus 30 days"
	ExpiresByType image/webp "access plus 30 days"
	ExpiresByType image/svg+xml "access plus 30 days"
	ExpiresByType image/x-icon "access plus 30 days"
</IfModule>
