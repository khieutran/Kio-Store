# Cho WordPress gọi lại chính nó ("loopback") bằng đúng địa chỉ của site: http://localhost:8080.
#
# WP-Cron, Action Scheduler (giá sale hẹn giờ, flash sale, bảng lookup của Woo…) và Site Health
# đều chạy bằng cách tự gửi request tới siteurl. Docker chuyển cổng 8080 của MÁY MAC vào cổng 80
# của container, nên BÊN TRONG container không có gì nghe ở 8080 → mọi việc nền thất bại
# ("cURL error 7: Failed to connect to localhost:8080"). Nghe thêm 8080 thì địa chỉ đó chạy được
# ở cả hai phía. Trên server thật (Phase 7) không cần file này: site có tên miền thật.
Listen 8080

<VirtualHost *:8080>
	DocumentRoot /var/www/html
</VirtualHost>
