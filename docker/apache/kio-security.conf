# Chặn ở Apache: request bị từ chối trước khi PHP chạy, và áp dụng cả cho trang lấy từ page cache
# (Cache Enabler trả HTML trước khi WordPress chạy hook, nên header đặt bằng PHP không có ở đó).
#
# File này được mount với tên zz-kio-security.conf: Apache nạp conf-enabled/ theo bảng chữ cái, phải
# đứng sau security.conf của image, nếu không ServerTokens ở đây bị đè.

# Image chỉ có sẵn file mod_headers, chưa bật.
<IfModule !mod_headers.c>
	LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>

# uploads/ là thư mục WordPress ghi được và khách có thể gửi file vào (ảnh đánh giá). Nếu PHP chạy
# được ở đây thì một lỗi upload của bất kỳ plugin nào cũng thành chiếm quyền cả site.
# Không đặt AllowOverride None: Woo dùng .htaccess để khoá wc-logs/ và woocommerce_uploads/.
<Directory "/var/www/html/wp-content/uploads">
	<FilesMatch "(?i)\.(php\d?|phtml|phar)$">
		Require all denied
	</FilesMatch>
</Directory>

# readme.html, license.txt: lộ phiên bản. wp-config-sample.php: không cần công khai.
# xmlrpc.php: site không dùng, mà system.multicall cho thử nhiều mật khẩu trong một request.
<FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php|xmlrpc\.php)$">
	Require all denied
</FilesMatch>

# Log và file sao lưu: wp-content/debug.log lộ đường dẫn server, plugin cũng hay ghi log vào wp-content.
<FilesMatch "(?i)\.(log|sql|bak|old|orig)$">
	Require all denied
</FilesMatch>

# Chỉ giảm thông tin cho kẻ dò quét, không thay thế việc cập nhật phiên bản.
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
	# "set" thay giá trị WordPress đã gửi (wp-admin có X-Frame-Options riêng), tránh header bị lặp.
	Header set X-Content-Type-Options "nosniff"
	Header set X-Frame-Options "SAMEORIGIN"
	Header set Referrer-Policy "strict-origin-when-cross-origin"
	Header set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()"
	Header unset X-Powered-By
</IfModule>
