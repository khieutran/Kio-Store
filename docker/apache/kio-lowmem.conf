# VM nhỏ: mỗi tiến trình Apache kèm PHP tốn vài chục MiB, mặc định có thể mở tới 150 tiến trình và hết RAM.
# Giới hạn thấp thì khách đông phải xếp hàng một chút, nhưng site không sập.
<IfModule mpm_prefork_module>
	StartServers 2
	MinSpareServers 1
	MaxSpareServers 3
	MaxRequestWorkers 6
	MaxConnectionsPerChild 300
</IfModule>
