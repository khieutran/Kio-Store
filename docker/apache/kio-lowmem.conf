# VM nhỏ: mỗi tiến trình Apache kèm PHP tốn vài chục MiB, mặc định có thể mở tới 150 tiến trình và hết RAM.
# Giới hạn thấp thì khách đông phải xếp hàng một chút, nhưng site không sập.
#
# Đủ 6 tiến trình chờ sẵn: một trang có ~70 file, sinh thêm tiến trình lúc khách vào rất chậm trên VM này.
<IfModule mpm_prefork_module>
	StartServers 6
	MinSpareServers 6
	MaxSpareServers 6
	MaxRequestWorkers 6
	MaxConnectionsPerChild 300
</IfModule>

# Prefork: mỗi kết nối giữ nguyên một tiến trình. Caddy giữ kết nối mở thì 6 tiến trình bận suốt 5 giây
# dù không làm gì, file khác phải xếp hàng (Lighthouse mobile 48 điểm, Speed Index 19 giây).
# Caddy và Apache cùng máy nên mở kết nối mới gần như không tốn gì.
KeepAlive Off
