# CI: chạy mỗi khi push lên main hoặc mở/cập nhật Pull Request.
#
#   lint  (~1 phút): cú pháp PHP, chuẩn WordPress cho plugin/theme, JSON, script bash
#   smoke (~6 phút): dựng toàn bộ cửa hàng bằng install.sh rồi kiểm tra như khách thật
#
# Chỉ có CI (kiểm tra), chưa có CD (tự deploy): chưa có server, làm ở Phase 7.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

# Push liên tục lên cùng một nhánh thì huỷ lần chạy cũ, chỉ giữ lần mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none

      - name: Cú pháp PHP (php -l)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Cài PHPCS + WordPress Coding Standards
        run: composer install --no-interaction --no-progress

      - name: Chuẩn WordPress cho plugin và theme (PHPCS)
        run: vendor/bin/phpcs

      # "|| exit 1": dừng ngay khi gặp file lỗi. Viết "python ... && echo" thì lỗi ở file
      # không phải file cuối sẽ bị nuốt mất (bash -e bỏ qua lỗi trong chuỗi &&).
      - name: File JSON trong data/ hợp lệ
        run: for f in data/*.json; do python3 -m json.tool "$f" > /dev/null || exit 1; echo "OK $f"; done

      # Python của runner (giống môi trường chạy smoke-test.py ở job sau)
      - name: Cú pháp Python
        run: python3 -m py_compile scripts/smoke-test.py

      # Chạy shellcheck bằng image cố định phiên bản, giống hệt lệnh chạy ở máy dev (README).
      # Không dùng bản cài sẵn trên runner vì phiên bản khác nhau → kết quả khác nhau.
      - name: Script bash (shellcheck)
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.11.0 -x scripts/*.sh

  smoke:
    name: Smoke test
    needs: lint # lint đỏ thì không tốn 6 phút dựng site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Tạo .env từ mẫu
        run: cp .env.example .env

      - name: Dựng toàn bộ cửa hàng (install.sh)
        run: ./scripts/install.sh

      - name: Kiểm tra như khách hàng (smoke-test.py)
        run: python3 scripts/smoke-test.py

      - name: In log khi thất bại
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 wordpress db
          docker compose exec -T wordpress cat wp-content/debug.log || true

      - name: Dọn dẹp
        if: always()
        run: docker compose --profile tools down -v
